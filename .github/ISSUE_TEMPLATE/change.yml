name: Change
description: Intentional work — new config, integration, or improvement to the dotfiles
title: "[CHANGE] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What do I want to achieve and why.
      placeholder: e.g. Add fzf integration to the shell for fuzzy file/history search.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Free-form notes, commands to remember, or a quick checklist.
      value: |
        - [ ]
      placeholder: |
        - Test Lua 5.1 compatibility
        - Benchmark startup speed before/after
    validations:
      required: false
