version: "3"

dotenv:
  - .env

env:
  PATH: '{{.HOME}}/.local/share/nvim/mason/bin:{{.PATH}}'

includes:
  dev: .taskfiles/dev.yml
  shell:
    taskfile: .taskfiles/shell.yml
    aliases: [sh]
  actions:
    taskfile: .taskfiles/actions.yml
    aliases: [gh]
  container:
    taskfile: .taskfiles/containers.yml
    aliases: [ct]
  dotfiles:
    taskfile: .taskfiles/dotfiles.yml
    flatten: true

tasks:
  default:
    desc: "List all tasks"
    silent: true
    cmds:
      - task --list
