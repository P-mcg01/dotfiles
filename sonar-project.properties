sonar.projectKey=P-mcg01_dotfiles
sonar.organization=p-mcg01
sonar.sources=scripts,home/.chezmoiscripts,.github/workflows
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

#
# CODE COVERAGE
#
# Configure the files that should be ignored by code 
# coverage calculations.
#
sonar.coverage.exclusions=spec/**
sonar.coverageReportPaths=coverage/sonarqube.xml

#
# FILES
#
# Configure the files that should be completely 
# ignored by the analysis.
#
sonar.exclusions=coverage/**,\
  .git/**,\
  .task/**,\
  home/dot_*/**,\
  home/dot_*,\
  home/.chezmoiexternals/**,\
  home/.chezmoi.yaml.tmpl
