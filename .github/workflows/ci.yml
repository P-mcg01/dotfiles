name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mise_toml: |
            [tools]
            shfmt = "latest"
            taplo = "latest"
            yamlfmt = "latest"
            stylua = "latest"
            shellcheck = "latest"
            shellspec = "latest"
            hadolint = "latest"
            "github:hougesen/kdlfmt" = "latest"
            "aqua:Kampfkarren/selene" = "latest"

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kcov
          kcov --version

      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.50.0

      - name: Verify formatting
        run: |
          task check
          task shell:check

      - name: Run linting
        run: |
          task lint
          task shell:lint
          task container:lint

      - name: Run tests
        run: task shell:coverage

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          files: report/results_junit.xml
          comment_mode: always
          check_name: Test results

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_VERSION: "8.30.1"

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        if: ${{ steps.sonar.outcome == 'success' }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
