name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mise_toml: |
            [tools]
            shfmt = "latest"
            taplo = "latest"
            yamlfmt = "latest"
            stylua = "latest"
            shellcheck = "latest"
            shellspec = "latest"
            "github:hougesen/kdlfmt" = "latest"

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.50.0

      - name: Verify formatting
        run: |
          task check
          task shell:check

      - name: Run tests
        run: task shell:test

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_VERSION: "8.30.1"
