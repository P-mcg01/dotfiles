# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv:
  - .env

tasks:
  #
  # Containers
  #
  build:*:
    desc: "Build local image for distribution {{.DISTRO}}"
    dir: validation/containers
    vars:
      DISTRO: "{{index .MATCH 0}}"
    cmds:
      - podman build -t dotfiles-{{.DISTRO}}:dev -f {{.DISTRO}} .

  snapshot:
    desc: "Capture uncommitted working tree state into a tarball"
    internal: true
    vars:
      SNAPSHOT_PATH: "{{.SNAPSHOT_PATH}}"
    cmds:
      - |
        git ls-files -z \
          --cached --others --exclude-standard \
          -- . ':!.env' ':!**/.env' ':!**/*.env' \
          | tar --null --ignore-failed-read -czf "{{.SNAPSHOT_PATH}}" --files-from=-

  container:create:
    desc: "Create and start an ephemeral container"
    internal: true
    vars:
      IMAGE: "{{.IMAGE}}"
      DISTRO: "{{.DISTRO}}"
      CID_FILE: "{{.CID_FILE}}"
    cmds:
      - |
        CONTAINER_ID=$(podman create --rm -t \
          -e DOPPLER_TOKEN \
          --hostname dotfiles-{{.DISTRO}} \
          {{.IMAGE}})
        podman start "$CONTAINER_ID" >/dev/null
        echo "$CONTAINER_ID" > "{{.CID_FILE}}"

  container:seed:
    desc: "Copy snapshot into container and extract it"
    internal: true
    vars:
      CID_FILE: "{{.CID_FILE}}"
      SNAPSHOT_PATH: "{{.SNAPSHOT_PATH}}"
      TARGET_DIR: "{{.TARGET_DIR}}"
    cmds:
      - |
        CONTAINER_ID=$(cat "{{.CID_FILE}}")
        podman exec "$CONTAINER_ID" mkdir -p "{{.TARGET_DIR}}"
        podman cp "{{.SNAPSHOT_PATH}}" "$CONTAINER_ID:/tmp/snapshot.tar.gz"
        podman exec "$CONTAINER_ID" tar -xzf /tmp/snapshot.tar.gz -C "{{.TARGET_DIR}}"

  run:*:
    desc: "Run ephemeral container for distribution {{.DISTRO}}"
    interactive: true
    vars:
      DISTRO: "{{index .MATCH 0}}"
      TAG: '{{.TAG | default "dev"}}'
      IMAGE: '{{if eq .TAG "dev"}}localhost/dotfiles-{{.DISTRO}}:dev{{else}}ghcr.io/p-mcg01/dotfiles-{{.DISTRO}}:{{.TAG}}{{end}}'
      SNAPSHOT: "/tmp/dotfiles-snapshot-{{.DISTRO}}.tar.gz"
      TARGET_DIR: "/home/tux/.local/share/chezmoi"
      CID_FILE: "/tmp/dotfiles-cid-{{.DISTRO}}"
    cmds:
      - task: snapshot
        vars: {SNAPSHOT_PATH: "{{.SNAPSHOT}}"}
      - task: container:create
        vars: {IMAGE: "{{.IMAGE}}", DISTRO: "{{.DISTRO}}", CID_FILE: "{{.CID_FILE}}"}
      - task: container:seed
        vars: {CID_FILE: "{{.CID_FILE}}", SNAPSHOT_PATH: "{{.SNAPSHOT}}", TARGET_DIR: "{{.TARGET_DIR}}"}
      - podman attach $(cat {{.CID_FILE}})
      - defer: rm -f "{{.SNAPSHOT}}" "{{.CID_FILE}}"

  #
  # Development
  #
  setup:
    desc: "Prepare the local development environment"
    cmds:
      - task: install
      - pre-commit install
  install:
    desc: "Install pinned development tools"
    cmds:
      - mise install
  show-tools:
    desc: "Show active tool versions"
    cmds:
      - mise current

  #
  # Bash
  #
  fmt:
    desc: "Format bash scripts with shfmt"
    cmds:
      - shfmt -w scripts/
  fmt-check:
    desc: "Check bash scripts formatting with shfmt"
    cmds:
      - shfmt -d scripts/
  lint:
    desc: "Lint bash scripts with shellcheck"
    cmds:
      - find scripts -type f -name '*.sh' -exec shellcheck {} +
  test:
    desc: "Run shellspec tests"
    cmds:
      - shellspec
  test-check:
    desc: "Check shellspec specs without running them"
    cmds:
      - shellspec --syntax-check
  test-list:
    desc: "List shellspec specs and examples"
    cmds:
      - shellspec --list specfiles
      - shellspec --list examples
  test-count:
    desc: "Count shellspec specfiles and examples"
    cmds:
      - shellspec --count
  test-coverage:
    desc: "Run shellspec tests with kcov coverage"
    cmds:
      - shellspec --kcov
  test-coverage-clean:
    desc: "Run shellspec tests with fresh kcov coverage report"
    cmds:
      - rm -rf coverage
      - shellspec --kcov
  #
  # GitHub Actions
  #
  actions-fmt:
    desc: "Format github actions workflows with yamlfmt"
    cmds:
      - yamlfmt .github/workflows/

  actions-fmt-check:
    desc: "Check github actions workflow formatting with yamlfmt"
    cmds:
      - yamlfmt -lint .github/workflows/

  actions-lint:
    desc: "Lint github actions workflows with actionlint"
    cmds:
      - actionlint
