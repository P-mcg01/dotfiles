name: Bug
description: Something stopped working or isn't behaving as expected
title: "[BUG] "
body:
  - type: textarea
    id: issue
    attributes:
      label: What's broken?
      description: Describe the bug, symptoms, or error message.
      placeholder: e.g. Starship prompt doesn't show git status on Arch Linux.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: false

  - type: input
    id: host
    attributes:
      label: Host / OS
      description: Which machine(s) this shows up on. Useful since chezmoi spans multiple hosts.
      placeholder: e.g. fedora, debian, arch
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Root Cause & Fix
      description: Fill this in during/after diagnosis to record the fix for future reference.
      placeholder: e.g. Missing libgit2 dependency or missing chezmoi template variable.
    validations:
      required: false
