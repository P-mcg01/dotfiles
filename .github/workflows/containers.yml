name: container build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  detect-changes:
    name: detect container changes
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters.yaml

      - name: Generate build matrix
        id: matrix
        env:
          DEBIAN_CHANGED: ${{ steps.changes.outputs.debian }}
          FEDORA_CHANGED: ${{ steps.changes.outputs.fedora }}
        run: |-
          images=()

          if [[ "$DEBIAN_CHANGED" == "true" ]]; then
            images+=("{\"distro\":\"debian\"}")
          fi

          if [[ "$FEDORA_CHANGED" == "true" ]]; then
            images+=("{\"distro\":\"fedora\"}")
          fi

          if (( ${#images[@]} == 0 )); then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="{\"include\":[$(IFS=,; echo "${images[*]}")]}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: build ${{ matrix.distro }} image
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Generate image reference
        id: image
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          package="dotfiles-${DISTRO}"
          tag="v$(date -u +%y.%m.%d)-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/${package}:${tag}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image
        id: docker-build
        uses: docker/build-push-action@v7.2.0
        with:
          context: validation/containers
          file: validation/containers/${{ matrix.distro }}
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true

      - name: Comment image build result
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: docker-image-build-${{ matrix.distro }}
          message: |-
            ## ${{ steps.docker-build.outcome == 'success' && '✅' || '🔴' }} ${{ matrix.distro }} Docker image build

            Result: `${{ steps.docker-build.outcome }}`
            Image tag: `${{ steps.image.outputs.ref }}`
            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Run Trivy image scan
        if: steps.docker-build.outcome == 'success' && github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          ignore-unfixed: true
          format: table
          output: trivy-image.txt
          severity: HIGH,CRITICAL
          hide-progress: true
          exit-code: "0"

      - name: Prepare Trivy comment
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            icon="🔴"
            if [[ ! -f trivy-image.txt ]]; then
              body="Image scan did not produce a report."
            elif grep -Eq ' (HIGH|CRITICAL) ' trivy-image.txt; then
              fence="\`\`\`"
              body="$(printf '%s\n%s\n%s' "$fence" "$(cat trivy-image.txt)" "$fence")"
            else
              icon="✅"
              body="No HIGH or CRITICAL fixable vulnerabilities found."
            fi
            echo "## $icon ${{ matrix.distro }} Trivy image scan"
            echo
            echo "Image tag: \`${{ steps.image.outputs.ref }}\`"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "$body"
          } > trivy-image-comment.txt

      - name: Comment Trivy image scan
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: trivy-image-scan-${{ matrix.distro }}
          path: trivy-image-comment.txt

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push "${{ steps.image.outputs.ref }}"

  ci-complete:
    name: ci complete
    runs-on: ubuntu-24.04
    needs:
      - detect-changes
      - build-and-publish
    if: always()
    steps:
      - name: Check result
        run: |-
          set -euo pipefail

          has_changes="${{ needs.detect-changes.outputs.has_changes }}"

          if [[ "$has_changes" != "true" ]]; then
            echo "No container changes detected; nothing to build or publish."
            exit 0
          fi

          test "${{ needs.build-and-publish.result }}" = "success"

          echo "CI complete: all checks passed."
